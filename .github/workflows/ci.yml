name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install and bootstrap the application
        run: composer setup

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit frontend dependencies
        run: npm audit

      - name: Check PHP style
        run: composer lint

      - name: Run tests
        run: composer test

      - name: Lint frontend
        run: npm run lint

      - name: Test live updates
        run: npm run test:live-updates
